<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traducteur Français-Anglais</title>
</head>
<body>
    <h1>Traducteur Français-Anglais</h1>
    <form method="POST">
        <label for="phrase_fr">Entrez une phrase en français :</label>
        <input type="text" name="phrase_fr" id="phrase_fr" required>
        <input type="submit" value="Traduire">
    </form>
    <h2>Résultat de la traduction :</h2>
    <p>{{ traduction }}</p>
</body>
</html>
